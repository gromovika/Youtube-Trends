[project]
name = "yt-long-trend-analyzer"
version = "0.1.0"
description = ""
authors = [
    {name = "gromovika",email = "hellohandsomepostman@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "google-api-python-client (>=2.201.0,<3.0.0)",
    "pandas (>=3.0.6,<4.0.0)",
    "scikit-learn (>=1.9.1,<2.0.0)",
    "python-dotenv (>=1.2.4,<2.0.0)",
    "yt-dlp (>=2026.8.19,<2027.0.0)"
]

[tool.poetry]
packages = [{include = "yt_long_trend_analyzer", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.17.1,<0.18.0)"
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
# E: pycodestyle, F: Pyflakes, I: isort (сортировка импортов)
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"